<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Mercavejo — Promo 30s Estúdio (9:16)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Poppins";
        font-weight: 900;
        font-style: normal;
        src: url("assets/fonts/poppins-latin-900-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #012c47;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #012c47;
        font-family: "Inter", sans-serif;
      }
      /* Slots das sub-composições ocupam o quadro inteiro. */
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #el-transicoes {
        z-index: 50;
        pointer-events: none;
      }
      #el-acabamento {
        z-index: 90;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="60"
      data-width="1080"
      data-height="1920"
    >
      <!-- Cenas: uma sub-composição por cena, cortes nos beats (128 BPM; 1 beat = 0,46875 s). -->
      <div
        id="el-s1"
        data-composition-id="s1-gancho"
        data-composition-src="compositions/s1-gancho.html"
        data-start="0"
        data-duration="1.875"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e2"
        data-composition-id="e2-manifesto"
        data-composition-src="compositions/e2-manifesto.html"
        data-start="1.875"
        data-duration="3.75"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e3"
        data-composition-id="e3-estudio"
        data-composition-src="compositions/e3-estudio.html"
        data-start="5.625"
        data-duration="3.75"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e4"
        data-composition-id="e4-diferenciais"
        data-composition-src="compositions/e4-diferenciais.html"
        data-start="9.375"
        data-duration="5.625"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e5"
        data-composition-id="e5-cortes"
        data-composition-src="compositions/e5-cortes.html"
        data-start="15"
        data-duration="3.75"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e6"
        data-composition-id="e6-podcasts"
        data-composition-src="compositions/e6-podcasts.html"
        data-start="18.75"
        data-duration="3.75"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e7"
        data-composition-id="e7-producao"
        data-composition-src="compositions/e7-producao.html"
        data-start="22.5"
        data-duration="3.75"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-e8"
        data-composition-id="e8-assinatura"
        data-composition-src="compositions/e8-assinatura.html"
        data-start="26.25"
        data-duration="3.75"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Camada de transições (lâminas a 60° da peça dourada), acima das cenas. -->
      <div
        id="el-transicoes"
        data-composition-id="transicoes-30"
        data-composition-src="compositions/transicoes-30.html"
        data-start="0"
        data-duration="30"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Acabamento global: vinheta radial + grão de filme (catálogo grain-overlay). -->
      <div
        id="el-acabamento"
        data-composition-id="acabamento"
        data-composition-src="compositions/acabamento.html"
        data-start="0"
        data-duration="30"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Trilha original 30 s (scripts/make_music_30s.py), −14 LUFS. -->
      <audio
        id="el-trilha"
        data-timeline-role="music"
        src="assets/audio/mercavejo-trilha-30s.wav"
        data-start="0"
        data-duration="30"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
