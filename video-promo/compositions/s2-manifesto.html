<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>S2 — Manifesto: O Melhor do Marketing para seu Negócio</title>
  </head>
  <body>
    <template id="s2-manifesto-template">
      <style>
        @font-face {
          font-family: "Poppins";
          font-weight: 900;
          font-style: normal;
          src: url("../assets/fonts/poppins-latin-900-normal.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 700;
          font-style: normal;
          src: url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #012c47;
          color: #ffffff;
          font-family: "Poppins", sans-serif;
        }
        #s2-ouro {
          position: absolute;
          inset: 0;
          background: #d4b67b;
        }
        #s2-glow {
          position: absolute;
          left: -300px;
          top: 260px;
          width: 1680px;
          height: 1500px;
          background: radial-gradient(
            circle at 50% 45%,
            rgba(15, 58, 125, 0.75) 0%,
            rgba(32, 68, 125, 0.35) 38%,
            rgba(1, 44, 71, 0) 70%
          );
        }
        #s2-ghost {
          position: absolute;
          left: 0;
          top: 1380px;
          font-weight: 900;
          font-size: 360px;
          line-height: 1;
          letter-spacing: -0.04em;
          white-space: nowrap;
          color: rgba(212, 182, 123, 0.1);
        }
        #s2-stack {
          position: absolute;
          inset: 0;
        }
        .s2-linha {
          position: absolute;
          left: 0;
          width: 1080px;
          text-align: center;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.035em;
          white-space: nowrap;
        }
        #s2-l1 {
          top: 520px;
          font-size: 104px;
          color: #ffffff;
        }
        /* "O MELHOR DO" no 1º beat, em navy sobre o dourado (cópia que some no corte). */
        #s2-l1-ouro {
          top: 900px;
          font-size: 124px;
          color: #012c47;
        }
        #s2-l2 {
          top: 655px;
          font-size: 150px;
          color: #d4b67b;
        }
        #s2-l3 {
          top: 850px;
          font-size: 104px;
          color: #ffffff;
        }
        #s2-l4 {
          top: 980px;
          font-size: 150px;
          color: #ffffff;
        }
        #s2-sublinha {
          position: absolute;
          left: 200px;
          top: 1168px;
          width: 680px;
          height: 16px;
          background: #d4b67b;
          clip-path: polygon(10px 0, 680px 0, 670px 16px, 0 16px);
        }
        #s2-badge {
          position: absolute;
          left: 0;
          top: 1280px;
          width: 1080px;
          display: flex;
          justify-content: center;
        }
        #s2-badge-pill {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 22px 38px;
          border: 3px solid rgba(212, 182, 123, 0.85);
          border-radius: 999px;
          background: rgba(1, 44, 71, 0.65);
          font-family: "Inter", sans-serif;
          font-weight: 700;
          font-size: 36px;
          letter-spacing: 0.02em;
          color: #ffffff;
          white-space: nowrap;
        }
        #s2-badge-dot {
          display: block;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #d4b67b;
        }
      </style>

      <div id="root" data-composition-id="s2-manifesto" data-width="1080" data-height="1920">
        <div id="s2-glow"></div>
        <div id="s2-ghost" aria-hidden="true" data-layout-ignore>MARKETING MARKETING</div>
        <div id="s2-stack">
          <div class="s2-linha" id="s2-l1">O MELHOR DO</div>
          <div class="s2-linha" id="s2-l2">MARKETING</div>
          <div class="s2-linha" id="s2-l3">PARA SEU</div>
          <div class="s2-linha" id="s2-l4">NEGÓCIO</div>
          <div id="s2-sublinha"></div>
          <div id="s2-badge">
            <div id="s2-badge-pill">
              <span id="s2-badge-dot"></span>
              <span>Desde 2009 transformando negócios</span>
            </div>
          </div>
        </div>
        <!-- Beat 0: tela dourada (continuação do mergulho da cena 1). -->
        <div id="s2-ouro"></div>
        <div class="s2-linha" id="s2-l1-ouro">O MELHOR DO</div>
      </div>

      <script>
        (function () {
          const B = 60 / 128;
          const F = 1 / 30;
          const tl = gsap.timeline({ paused: true });

          // Ambiente
          tl.fromTo("#s2-ghost", { x: 80 }, { x: -700, duration: 2.8125, ease: "none" }, 0);
          tl.fromTo("#s2-glow", { scale: 0.92 }, { scale: 1.1, duration: 2.8125, ease: "sine.inOut" }, 0);
          tl.fromTo("#s2-stack", { scale: 1 }, { scale: 1.045, duration: 2.8125, ease: "none", transformOrigin: "50% 50%" }, 0);

          // b0 — fundo dourado, "O MELHOR DO" bate em navy (headline-slam: 1,6 → 1 + tremor).
          tl.fromTo("#s2-l1-ouro", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "expo.out" }, 0);
          tl.to("#s2-l1-ouro", { x: 9, y: -6, duration: F }, 0.24);
          tl.to("#s2-l1-ouro", { x: -6, y: 4, duration: F }, 0.24 + F);
          tl.to("#s2-l1-ouro", { x: 0, y: 0, duration: F }, 0.24 + 2 * F);
          // linhas da pilha começam ocultas
          tl.set(["#s2-l1", "#s2-l2", "#s2-l3", "#s2-l4", "#s2-sublinha", "#s2-badge"], { opacity: 0 }, 0);

          // b1 — corte seco para navy; "O MELHOR DO" salta ao topo; "MARKETING" estoura.
          tl.set(["#s2-ouro", "#s2-l1-ouro"], { opacity: 0 }, B);
          tl.fromTo("#s2-l1", { opacity: 1, y: 380, scale: 1.19 }, { y: 0, scale: 1, duration: 0.24, ease: "power4.out", immediateRender: false }, B);
          tl.fromTo(
            "#s2-l2",
            { opacity: 0, scale: 2.3, filter: "blur(14px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false },
            B,
          );
          tl.to("#s2-stack", { x: 16, y: -10, duration: F }, B + 0.26);
          tl.to("#s2-stack", { x: -11, y: 7, duration: F }, B + 0.26 + F);
          tl.to("#s2-stack", { x: 0, y: 0, duration: F }, B + 0.26 + 2 * F);

          // b2 — "PARA SEU" entra lateral.
          tl.fromTo("#s2-l3", { opacity: 0, x: -760 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 2 * B);

          // b3 — "NEGÓCIO" sobe girando; sublinhado dourado desenha.
          tl.fromTo(
            "#s2-l4",
            { opacity: 0, y: 240, rotation: 7 },
            { opacity: 1, y: 0, rotation: 0, duration: 0.36, ease: "back.out(1.5)", immediateRender: false },
            3 * B,
          );
          tl.fromTo(
            "#s2-sublinha",
            { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" },
            { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
            3 * B + 0.12,
          );

          // b4 — badge real do site entra com mola.
          tl.fromTo(
            "#s2-badge",
            { opacity: 0, y: 60, scale: 0.7 },
            { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false },
            4 * B,
          );
          // b5 — "MARKETING" pulsa no beat.
          tl.fromTo("#s2-l2", { scale: 1 }, { scale: 1.06, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 5 * B);

          // Saída (a lâmina dourada da camada de transições assume o corte em 2,8125).
          tl.to(["#s2-l1", "#s2-l2", "#s2-l3"], { y: -140, opacity: 0, duration: 0.2, ease: "power4.in", stagger: 0.025 }, 2.56);
          tl.to(["#s2-l4", "#s2-sublinha", "#s2-badge"], { y: -140, opacity: 0, duration: 0.2, ease: "power4.in", stagger: 0.025 }, 2.6);

          window.__timelines["s2-manifesto"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
