<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>S4 — Estúdio Mercavejo</title>
  </head>
  <body>
    <template id="s4-estudio-template">
      <style>
        @font-face {
          font-family: "Poppins";
          font-weight: 900;
          font-style: normal;
          src: url("../assets/fonts/poppins-latin-900-normal.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 700;
          font-style: normal;
          src: url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #012c47;
          color: #ffffff;
          font-family: "Inter", sans-serif;
        }
        #s4-whip {
          position: absolute;
          inset: 0;
        }
        #s4-foto-mask {
          position: absolute;
          inset: 0;
          overflow: hidden;
          clip-path: polygon(-40% 0%, 140% 0%, 120% 100%, -60% 100%);
        }
        #s4-foto {
          position: absolute;
          left: -180px;
          top: 0;
          width: 1440px;
          height: 1920px;
          object-fit: cover;
        }
        /* Escurecimento radial para legibilidade (sem gradiente linear de tela cheia). */
        #s4-sombra {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 120% 60% at 50% 100%, rgba(1, 44, 71, 0.96) 30%, rgba(1, 44, 71, 0) 75%),
            radial-gradient(ellipse 110% 35% at 50% 0%, rgba(1, 44, 71, 0.8) 20%, rgba(1, 44, 71, 0) 80%);
        }
        /* Ondas de áudio decorativas (podcast), pulsam no beat. */
        #s4-ondas {
          position: absolute;
          left: 80px;
          top: 250px;
          width: 920px;
          height: 120px;
          display: flex;
          align-items: center;
          gap: 9px;
        }
        .s4-barra {
          display: block;
          width: 14px;
          height: 120px;
          border-radius: 7px;
          background: #d4b67b;
        }
        #s4-pill {
          position: absolute;
          left: 80px;
          top: 1000px;
          padding: 14px 28px;
          border-radius: 999px;
          background: #d4b67b;
          color: #012c47;
          font-weight: 700;
          font-size: 34px;
          letter-spacing: 0.14em;
          white-space: nowrap;
        }
        .s4-titulo-mask {
          position: absolute;
          left: 80px;
          width: 940px;
          height: 160px;
          overflow: hidden;
        }
        #s4-t1m {
          top: 1086px;
        }
        #s4-t2m {
          top: 1226px;
        }
        .s4-titulo {
          display: block;
          font-family: "Poppins", sans-serif;
          font-weight: 900;
          font-size: 144px;
          line-height: 1.05;
          letter-spacing: -0.04em;
          white-space: nowrap;
        }
        #s4-t2 {
          color: #d4b67b;
        }
        #s4-label {
          position: absolute;
          left: 80px;
          top: 1418px;
          font-weight: 700;
          font-size: 34px;
          letter-spacing: 0.16em;
          color: rgba(255, 255, 255, 0.8);
          white-space: nowrap;
        }
        #s4-ticker-mask {
          position: absolute;
          left: 0;
          top: 1478px;
          width: 1080px;
          height: 74px;
          overflow: hidden;
          border-top: 2px solid rgba(212, 182, 123, 0.5);
          border-bottom: 2px solid rgba(212, 182, 123, 0.5);
          background: rgba(1, 44, 71, 0.6);
        }
        #s4-ticker {
          position: absolute;
          left: 0;
          top: 10px;
          display: flex;
          gap: 34px;
          white-space: nowrap;
          font-weight: 700;
          font-size: 40px;
          line-height: 50px;
        }
        .s4-diamante {
          display: inline-block;
          width: 20px;
          height: 20px;
          margin-top: 15px;
          background: #d4b67b;
          clip-path: polygon(6px 0, 20px 0, 14px 20px, 0 20px);
        }
      </style>

      <div id="root" data-composition-id="s4-estudio" data-width="1080" data-height="1920">
        <div id="s4-whip">
          <div id="s4-foto-mask">
            <img id="s4-foto" src="../assets/img/estudio.webp" alt="Estúdio Mercavejo" />
          </div>
          <div id="s4-sombra"></div>
          <div id="s4-ondas"></div>
          <div id="s4-pill">EXCLUSIVIDADE EM CATANDUVA</div>
          <div class="s4-titulo-mask" id="s4-t1m"><span class="s4-titulo" id="s4-t1">Estúdio</span></div>
          <div class="s4-titulo-mask" id="s4-t2m"><span class="s4-titulo" id="s4-t2">Mercavejo</span></div>
          <div id="s4-label">PODCASTS DE SUCESSO</div>
          <!-- Podcasts reais listados em client/src/components/Studio.tsx -->
          <div id="s4-ticker-mask">
            <div id="s4-ticker">
              <span>Treina que sara</span><span class="s4-diamante"></span>
              <span>Antes da consulta</span><span class="s4-diamante"></span>
              <span>Café com Zakia</span><span class="s4-diamante"></span>
              <span>Sai do raso</span><span class="s4-diamante"></span>
              <span>Gente amiga</span><span class="s4-diamante"></span>
              <span>Treina que sara</span><span class="s4-diamante"></span>
              <span>Antes da consulta</span><span class="s4-diamante"></span>
              <span>Café com Zakia</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const B = 60 / 128;
          const tl = gsap.timeline({ paused: true });

          // Barras de áudio: alturas determinísticas (sem Math.random).
          const ondas = document.getElementById("s4-ondas");
          const N = 40;
          for (let i = 0; i < N; i++) {
            const b = document.createElement("span");
            b.className = "s4-barra";
            b.id = "s4-b" + i;
            ondas.appendChild(b);
          }
          for (let i = 0; i < N; i++) {
            const base = 0.18 + 0.5 * Math.abs(Math.sin(i * 0.61) * Math.cos(i * 0.23));
            for (let k = 0; k < 4; k++) {
              const peak = Math.min(1, base + 0.55 * Math.abs(Math.sin(i * 1.37 + k * 2.1)));
              tl.fromTo(
                "#s4-b" + i,
                { scaleY: peak },
                { scaleY: base * 0.6, duration: B, ease: "power2.out", immediateRender: k === 0 },
                k * B,
              );
            }
          }

          // Revelação: máscara em paralelogramo (60°) abre a partir de uma lâmina.
          tl.fromTo(
            "#s4-foto-mask",
            { clipPath: "polygon(48% 40%, 60% 40%, 52% 60%, 40% 60%)" },
            { clipPath: "polygon(-40% 0%, 140% 0%, 120% 100%, -60% 100%)", duration: 0.42, ease: "expo.out" },
            0,
          );
          // Ken Burns: push-in contínuo.
          tl.fromTo("#s4-foto", { scale: 1.25, x: 40 }, { scale: 1.04, x: 0, duration: 1.875, ease: "power2.out" }, 0);
          tl.fromTo("#s4-sombra", { opacity: 0.5 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

          // Texto no beat.
          tl.fromTo("#s4-pill", { opacity: 0, x: -80, scale: 0.8 }, { opacity: 1, x: 0, scale: 1, duration: 0.32, ease: "back.out(2)" }, B * 0.5);
          tl.fromTo("#s4-t1", { yPercent: 105 }, { yPercent: 0, duration: 0.34, ease: "power4.out" }, B);
          tl.fromTo("#s4-t2", { yPercent: 105 }, { yPercent: 0, duration: 0.34, ease: "power4.out" }, B + 0.1);
          tl.fromTo("#s4-label", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 2 * B);
          tl.fromTo("#s4-ticker-mask", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power4.out" }, 2 * B);
          tl.fromTo("#s4-ticker", { x: 60 }, { x: -820, duration: 1.875 - 2 * B, ease: "none" }, 2 * B);

          // Whip para a esquerda no fim (corte em 1,875 com glitch RGB da camada de transições).
          tl.to("#s4-whip", { x: -260, filter: "blur(10px)", duration: 0.14, ease: "power3.in" }, 1.875 - 0.14);

          window.__timelines["s4-estudio"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
