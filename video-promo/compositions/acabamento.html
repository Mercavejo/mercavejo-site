<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Acabamento — vinheta + grão de filme</title>
  </head>
  <body>
    <template id="acabamento-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        /* Vinheta radial (sem gradiente linear de tela cheia, que faz banding em H.264). */
        #acab-vinheta {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse 78% 62% at 50% 48%,
            rgba(10, 25, 47, 0) 58%,
            rgba(10, 25, 47, 0.42) 100%
          );
        }
        /* Grão de filme — catálogo HyperFrames: grain-overlay (opacidade reduzida p/ marca). */
        @keyframes hf-grain-noise {
          0%,
          100% {
            transform: translate(0, 0);
          }
          10% {
            transform: translate(-5%, -5%);
          }
          20% {
            transform: translate(-10%, 5%);
          }
          30% {
            transform: translate(5%, -10%);
          }
          40% {
            transform: translate(-5%, 15%);
          }
          50% {
            transform: translate(-10%, 5%);
          }
          60% {
            transform: translate(15%, 0);
          }
          70% {
            transform: translate(0, 10%);
          }
          80% {
            transform: translate(-15%, 0);
          }
          90% {
            transform: translate(10%, 5%);
          }
        }
        #acab-grain {
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
          opacity: 0.075;
          mix-blend-mode: overlay;
          animation: hf-grain-noise 0.5s steps(1) infinite;
        }
      </style>
      <div id="root" data-composition-id="acabamento" data-width="1080" data-height="1920">
        <div id="acab-vinheta"></div>
        <div id="acab-grain"></div>
      </div>
      <script>
        window.__timelines["acabamento"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
