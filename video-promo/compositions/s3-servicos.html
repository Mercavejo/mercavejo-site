<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>S3 — Serviços: um por beat</title>
  </head>
  <body>
    <template id="s3-servicos-template">
      <style>
        @font-face {
          font-family: "Poppins";
          font-weight: 900;
          font-style: normal;
          src: url("../assets/fonts/poppins-latin-900-normal.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 600;
          font-style: normal;
          src: url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 700;
          font-style: normal;
          src: url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #012c47;
          color: #ffffff;
          font-family: "Inter", sans-serif;
        }
        #s3-glow {
          position: absolute;
          left: -200px;
          top: 300px;
          width: 1500px;
          height: 1500px;
          background: radial-gradient(circle at 50% 50%, rgba(212, 182, 123, 0.2) 0%, rgba(1, 44, 71, 0) 62%);
        }
        /* Âncora fixa (fixed-anchor-cycle): rótulo + contador + barra de progresso. */
        #s3-anchor {
          position: absolute;
          left: 80px;
          top: 290px;
          width: 920px;
          height: 60px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        #s3-label {
          display: flex;
          align-items: center;
          gap: 18px;
          font-weight: 700;
          font-size: 40px;
          letter-spacing: 0.2em;
          color: #d4b67b;
          white-space: nowrap;
        }
        #s3-label-chip {
          display: block;
          width: 34px;
          height: 30px;
          background: #d4b67b;
          clip-path: polygon(10px 0, 34px 0, 24px 30px, 0 30px);
        }
        #s3-contador {
          position: relative;
          width: 170px;
          height: 50px;
          font-weight: 700;
          font-size: 40px;
          letter-spacing: 0.08em;
          color: #ffffff;
        }
        .s3-num {
          position: absolute;
          right: 0;
          top: 0;
          white-space: nowrap;
          opacity: 0;
        }
        #s3-barra {
          position: absolute;
          left: 80px;
          top: 380px;
          width: 920px;
          height: 8px;
          background: rgba(255, 255, 255, 0.16);
        }
        #s3-barra-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 920px;
          height: 8px;
          background: #d4b67b;
        }
        /* Pilha de cards: um por beat. */
        .s3-card {
          position: absolute;
          left: 60px;
          top: 470px;
          width: 960px;
          height: 1050px;
          border-radius: 44px;
          overflow: hidden;
          opacity: 0;
          visibility: hidden;
          box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35);
        }
        .s3-card.navy {
          background: #0a2a4a;
          border: 3px solid rgba(212, 182, 123, 0.35);
          color: #ffffff;
        }
        .s3-card.azul {
          background: #0f3a7d;
          color: #ffffff;
        }
        .s3-card.ouro {
          background: #d4b67b;
          color: #012c47;
        }
        .s3-card-num {
          position: absolute;
          right: -30px;
          bottom: -150px;
          font-family: "Poppins", sans-serif;
          font-weight: 900;
          font-size: 700px;
          line-height: 1;
          letter-spacing: -0.06em;
          opacity: 0.12;
        }
        .s3-card-tag {
          position: absolute;
          left: 70px;
          top: 70px;
          font-weight: 700;
          font-size: 36px;
          letter-spacing: 0.16em;
          opacity: 0.8;
        }
        .s3-card-titulo {
          position: absolute;
          left: 70px;
          top: 330px;
          width: 840px;
          font-family: "Poppins", sans-serif;
          font-weight: 900;
          font-size: 128px;
          line-height: 1.02;
          letter-spacing: -0.035em;
        }
        .s3-l {
          display: block;
          white-space: nowrap;
        }
        .s3-card-sub {
          position: absolute;
          left: 70px;
          top: 700px;
          width: 800px;
          font-weight: 600;
          font-size: 40px;
          line-height: 1.25;
          opacity: 0.9;
        }
        .s3-card-traco {
          position: absolute;
          left: 70px;
          top: 650px;
          width: 120px;
          height: 10px;
          background: #d4b67b;
        }
        .s3-card.ouro .s3-card-traco {
          background: #012c47;
        }
      </style>

      <div id="root" data-composition-id="s3-servicos" data-width="1080" data-height="1920">
        <div id="s3-glow"></div>
        <div id="s3-anchor">
          <div id="s3-label"><span id="s3-label-chip"></span>NOSSOS SERVIÇOS</div>
          <div id="s3-contador">
            <span class="s3-num" id="s3-n1">01/08</span>
            <span class="s3-num" id="s3-n2">02/08</span>
            <span class="s3-num" id="s3-n3">03/08</span>
            <span class="s3-num" id="s3-n4">04/08</span>
            <span class="s3-num" id="s3-n5">05/08</span>
            <span class="s3-num" id="s3-n6">06/08</span>
            <span class="s3-num" id="s3-n7">07/08</span>
            <span class="s3-num" id="s3-n8">08/08</span>
          </div>
        </div>
        <div id="s3-barra"><div id="s3-barra-fill"></div></div>

        <!-- Serviços reais (client/src/components/Services.tsx) — ver BRIEF.md § Notes 4. -->
        <div class="s3-card azul" id="s3-c1">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>01</div>
          <div class="s3-card-tag">SERVIÇO 01</div>
          <div class="s3-card-titulo"><span class="s3-l">Tráfego</span><span class="s3-l">Pago</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Gestão de anúncios para atrair leads e acelerar vendas</div>
        </div>
        <div class="s3-card navy" id="s3-c2">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>02</div>
          <div class="s3-card-tag">SERVIÇO 02</div>
          <div class="s3-card-titulo"><span class="s3-l">Google</span><span class="s3-l">Ads</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Configuração e lançamento de campanhas</div>
        </div>
        <div class="s3-card ouro" id="s3-c3">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>03</div>
          <div class="s3-card-tag">SERVIÇO 03</div>
          <div class="s3-card-titulo"><span class="s3-l">Redes</span><span class="s3-l">Sociais</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Planejamento, calendário editorial e postagem</div>
        </div>
        <div class="s3-card azul" id="s3-c4">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>04</div>
          <div class="s3-card-tag">SERVIÇO 04</div>
          <div class="s3-card-titulo"><span class="s3-l">Criação</span><span class="s3-l">de Sites</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Landing pages e e-commerce</div>
        </div>
        <div class="s3-card navy" id="s3-c5">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>05</div>
          <div class="s3-card-tag">SERVIÇO 05</div>
          <div class="s3-card-titulo"><span class="s3-l">Vídeos</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Gravação e edição profissionais</div>
        </div>
        <div class="s3-card ouro" id="s3-c6">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>06</div>
          <div class="s3-card-tag">SERVIÇO 06</div>
          <div class="s3-card-titulo"><span class="s3-l">Artes &amp;</span><span class="s3-l">Logotipos</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Identidade visual e criativos para campanhas</div>
        </div>
        <div class="s3-card azul" id="s3-c7">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>07</div>
          <div class="s3-card-tag">SERVIÇO 07</div>
          <div class="s3-card-titulo"><span class="s3-l">Consultoria</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Marketing e vendas</div>
        </div>
        <div class="s3-card ouro" id="s3-c8">
          <div class="s3-card-num" aria-hidden="true" data-layout-ignore>08</div>
          <div class="s3-card-tag">SERVIÇO 08</div>
          <div class="s3-card-titulo"><span class="s3-l">Marketing</span><span class="s3-l">na Saúde</span></div>
          <div class="s3-card-traco"></div>
          <div class="s3-card-sub">Para clínicas, hospitais e profissionais de saúde</div>
        </div>
      </div>

      <script>
        (function () {
          const B = 60 / 128;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s3-glow", { scale: 0.9, x: -60 }, { scale: 1.1, x: 60, duration: 3.75, ease: "sine.inOut" }, 0);

          // Âncora entra uma vez e não se move mais.
          tl.fromTo("#s3-label", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.02);
          tl.fromTo("#s3-barra", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power4.out" }, 0);
          tl.set("#s3-barra-fill", { scaleX: 0, transformOrigin: "0% 50%" }, 0);

          // Entradas distintas por card (kinetic-beat-slam: nunca o mesmo helper repetido).
          const ENTRADAS = [
            [{ x: 1100, rotation: 6 }, { x: 0, rotation: 0, ease: "expo.out" }],
            [{ y: 1300 }, { y: 0, ease: "expo.out" }],
            [{ scale: 0.55, rotation: -10 }, { scale: 1, rotation: 0, ease: "back.out(1.6)" }],
            [{ x: -1100, rotation: -6 }, { x: 0, rotation: 0, ease: "expo.out" }],
            [{ y: -1300 }, { y: 0, ease: "expo.out" }],
            [{ rotationY: 80, x: 300, transformPerspective: 1600 }, { rotationY: 0, x: 0, ease: "power4.out" }],
            [{ scale: 1.5, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", ease: "expo.out" }],
            [{ x: 900, y: -700, rotation: 12 }, { x: 0, y: 0, rotation: 0, ease: "expo.out" }],
          ];

          for (let i = 0; i < 8; i++) {
            const t = i * B;
            const card = "#s3-c" + (i + 1);
            const from = Object.assign({ autoAlpha: 1 }, ENTRADAS[i][0]);
            const to = Object.assign({ autoAlpha: 1, duration: 0.3, immediateRender: false }, ENTRADAS[i][1]);
            tl.set(card, { autoAlpha: 0 }, 0);
            tl.fromTo(card, from, to, t);
            // título: linhas sobem em escada; subtítulo desliza.
            tl.fromTo(
              card + " .s3-l",
              { y: 90, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.26, ease: "power4.out", stagger: 0.05, immediateRender: false },
              t + 0.05,
            );
            tl.fromTo(card + " .s3-card-traco", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, t + 0.1);
            tl.fromTo(card + " .s3-card-sub", { x: -40, opacity: 0 }, { x: 0, opacity: 0.92, duration: 0.24, ease: "power3.out", immediateRender: false }, t + 0.12);
            tl.fromTo(card + " .s3-card-num", { x: 160 }, { x: -40, duration: B + 0.2, ease: "power2.out", immediateRender: false }, t);
            // card anterior recua sob o novo
            if (i > 0) {
              const prev = "#s3-c" + i;
              tl.to(prev, { scale: 0.92, duration: 0.16, ease: "power2.in" }, t);
              // o card 7 entra cobrindo a tela inteira (escala + blur): o anterior some no próprio beat
              tl.set(prev, { autoAlpha: 0 }, i === 6 ? t : t + 0.17);
            }
            // contador + barra
            tl.set(".s3-num", { opacity: 0 }, t);
            tl.set("#s3-n" + (i + 1), { opacity: 1 }, t);
            tl.fromTo("#s3-n" + (i + 1), { y: 26 }, { y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, t);
            tl.to("#s3-barra-fill", { scaleX: (i + 1) / 8, duration: 0.2, ease: "power3.out" }, t);
          }

          // Saída para a lâmina de transição (3,75).
          tl.to("#s3-c8", { scale: 1.08, duration: 0.25, ease: "power2.in" }, 3.5);

          window.__timelines["s3-servicos"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
