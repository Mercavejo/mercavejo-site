<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>E4 — Por que gravar no Estúdio Mercavejo? (3 diferenciais)</title>
  </head>
  <body>
    <template id="e4-diferenciais-template">
      <style>
        @font-face {
          font-family: "Poppins";
          font-weight: 900;
          font-style: normal;
          src: url("../assets/fonts/poppins-latin-900-normal.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 600;
          font-style: normal;
          src: url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 700;
          font-style: normal;
          src: url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #012c47;
          color: #ffffff;
          font-family: "Inter", sans-serif;
        }
        #e4-glow {
          position: absolute;
          left: -200px;
          top: 300px;
          width: 1500px;
          height: 1500px;
          background: radial-gradient(circle at 50% 50%, rgba(212, 182, 123, 0.2) 0%, rgba(1, 44, 71, 0) 62%);
        }
        /* Âncora fixa (fixed-anchor-cycle): pergunta real da página /podcast + contador. */
        #e4-pergunta {
          position: absolute;
          left: 80px;
          top: 236px;
          width: 920px;
          font-family: "Poppins", sans-serif;
          font-weight: 900;
          font-size: 58px;
          line-height: 1.08;
          letter-spacing: -0.02em;
        }
        #e4-pergunta-ouro {
          color: #d4b67b;
        }
        #e4-contador {
          position: absolute;
          right: 80px;
          top: 412px;
          width: 160px;
          height: 46px;
          font-weight: 700;
          font-size: 38px;
          letter-spacing: 0.08em;
        }
        .e4-num {
          position: absolute;
          right: 0;
          top: 0;
          white-space: nowrap;
          opacity: 0;
        }
        #e4-barra {
          position: absolute;
          left: 80px;
          top: 470px;
          width: 920px;
          height: 8px;
          background: rgba(255, 255, 255, 0.16);
        }
        #e4-barra-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 920px;
          height: 8px;
          background: #d4b67b;
        }
        .e4-card {
          position: absolute;
          left: 60px;
          top: 520px;
          width: 960px;
          height: 1060px;
          border-radius: 44px;
          overflow: hidden;
          opacity: 0;
          visibility: hidden;
          box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35);
        }
        .e4-card.azul {
          background: #0f3a7d;
          color: #ffffff;
        }
        .e4-card.ouro {
          background: #d4b67b;
          color: #012c47;
        }
        .e4-card.navy {
          background: #0a2a4a;
          border: 3px solid rgba(212, 182, 123, 0.4);
          color: #ffffff;
        }
        .e4-icone {
          position: absolute;
          left: 64px;
          top: 64px;
          width: 220px;
          height: 220px;
          overflow: visible;
        }
        .e4-icone path,
        .e4-icone rect,
        .e4-icone circle,
        .e4-icone line {
          fill: none;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .e4-card.azul .e4-icone *,
        .e4-card.navy .e4-icone * {
          stroke: #d4b67b;
        }
        .e4-card.ouro .e4-icone * {
          stroke: #012c47;
        }
        .e4-card-num {
          position: absolute;
          right: -20px;
          top: -60px;
          font-family: "Poppins", sans-serif;
          font-weight: 900;
          font-size: 420px;
          line-height: 1;
          letter-spacing: -0.06em;
          opacity: 0.12;
        }
        .e4-titulo {
          position: absolute;
          left: 64px;
          top: 330px;
          width: 840px;
          font-family: "Poppins", sans-serif;
          font-weight: 900;
          font-size: 124px;
          line-height: 1.02;
          letter-spacing: -0.035em;
        }
        .e4-l {
          display: block;
          white-space: nowrap;
        }
        .e4-traco {
          position: absolute;
          left: 64px;
          top: 610px;
          width: 120px;
          height: 10px;
          background: #d4b67b;
        }
        .e4-card.ouro .e4-traco {
          background: #012c47;
        }
        .e4-desc {
          position: absolute;
          left: 64px;
          top: 650px;
          width: 820px;
          font-weight: 600;
          font-size: 42px;
          line-height: 1.25;
        }
        .e4-chips {
          position: absolute;
          left: 64px;
          top: 880px;
          width: 840px;
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
        }
        .e4-chip {
          display: block;
          padding: 14px 24px;
          border-radius: 999px;
          font-weight: 700;
          font-size: 34px;
          white-space: nowrap;
          border: 3px solid currentColor;
        }
      </style>

      <div id="root" data-composition-id="e4-diferenciais" data-width="1080" data-height="1920">
        <div id="e4-glow"></div>
        <div id="e4-pergunta">Por que gravar no <span id="e4-pergunta-ouro">Estúdio Mercavejo?</span></div>
        <div id="e4-contador">
          <span class="e4-num" id="e4-n1">01/03</span>
          <span class="e4-num" id="e4-n2">02/03</span>
          <span class="e4-num" id="e4-n3">03/03</span>
        </div>
        <div id="e4-barra"><div id="e4-barra-fill"></div></div>

        <!-- Diferenciais e itens reais de client/src/pages/Podcast.tsx -->
        <div class="e4-card azul" id="e4-c1">
          <div class="e4-card-num" aria-hidden="true" data-layout-ignore>01</div>
          <svg class="e4-icone" viewBox="0 0 120 120" aria-hidden="true">
            <rect pathLength="1" x="42" y="8" width="36" height="62" rx="18" />
            <path pathLength="1" d="M26 52 a34 34 0 0 0 68 0" />
            <line pathLength="1" x1="60" y1="86" x2="60" y2="106" />
            <line pathLength="1" x1="40" y1="108" x2="80" y2="108" />
          </svg>
          <div class="e4-titulo"><span class="e4-l">Áudio</span><span class="e4-l">Cristalino</span></div>
          <div class="e4-traco"></div>
          <div class="e4-desc">Microfones de padrão internacional para uma experiência auditiva impecável.</div>
          <div class="e4-chips">
            <span class="e4-chip">Até 4 microfones Shure/Rode</span>
            <span class="e4-chip">Técnico de áudio acompanhando</span>
          </div>
        </div>

        <div class="e4-card ouro" id="e4-c2">
          <div class="e4-card-num" aria-hidden="true" data-layout-ignore>02</div>
          <svg class="e4-icone" viewBox="0 0 120 120" aria-hidden="true">
            <rect pathLength="1" x="6" y="32" width="76" height="56" rx="12" />
            <path pathLength="1" d="M82 52 L114 34 L114 86 L82 68 Z" />
            <circle pathLength="1" cx="30" cy="60" r="10" />
          </svg>
          <div class="e4-titulo"><span class="e4-l">Vídeo</span><span class="e4-l">em 4K</span></div>
          <div class="e4-traco"></div>
          <div class="e4-desc">Múltiplas câmeras capturando cada ângulo com qualidade de cinema.</div>
          <div class="e4-chips">
            <span class="e4-chip">Cenário e iluminação profissional</span>
          </div>
        </div>

        <div class="e4-card navy" id="e4-c3">
          <div class="e4-card-num" aria-hidden="true" data-layout-ignore>03</div>
          <svg class="e4-icone" viewBox="0 0 120 120" aria-hidden="true">
            <circle pathLength="1" cx="32" cy="92" r="16" />
            <circle pathLength="1" cx="88" cy="92" r="16" />
            <line pathLength="1" x1="43" y1="80" x2="96" y2="10" />
            <line pathLength="1" x1="77" y1="80" x2="24" y2="10" />
          </svg>
          <div class="e4-titulo"><span class="e4-l">Foco em</span><span class="e4-l">Cortes</span></div>
          <div class="e4-traco"></div>
          <div class="e4-desc">Gravamos pensando nos Reels e TikToks que vão viralizar seu conteúdo.</div>
          <div class="e4-chips">
            <span class="e4-chip">Reels/TikTok</span>
            <span class="e4-chip">YouTube Shorts</span>
            <span class="e4-chip">Instagram</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const B = 60 / 128;
          const D = 5.625;
          const CARD = 4 * B; // 1,875 s por diferencial
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#e4-glow", { scale: 0.9, x: -60 }, { scale: 1.12, x: 60, duration: D, ease: "sine.inOut" }, 0);

          // Âncora entra uma vez e fica.
          tl.fromTo("#e4-pergunta", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.34, ease: "expo.out" }, 0);
          tl.fromTo("#e4-barra", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power4.out" }, 0.05);
          tl.set("#e4-barra-fill", { scaleX: 0, transformOrigin: "0% 50%" }, 0);

          const ENTRADAS = [
            [{ y: 1300, rotation: 4 }, { y: 0, rotation: 0, ease: "expo.out" }],
            [{ x: 1150, rotation: 8 }, { x: 0, rotation: 0, ease: "expo.out" }],
            [{ scale: 1.5, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", ease: "expo.out" }],
          ];

          for (let i = 0; i < 3; i++) {
            const t = i * CARD;
            const card = "#e4-c" + (i + 1);
            tl.set(card, { autoAlpha: 0 }, 0);
            tl.fromTo(
              card,
              Object.assign({ autoAlpha: 1 }, ENTRADAS[i][0]),
              Object.assign({ autoAlpha: 1, duration: 0.34, immediateRender: false }, ENTRADAS[i][1]),
              t,
            );
            // ícone se desenha (svg-path-draw)
            tl.fromTo(
              card + " .e4-icone *",
              { strokeDashoffset: 1, strokeDasharray: 1 },
              { strokeDashoffset: 0, strokeDasharray: 1, duration: 0.5, ease: "power2.inOut", stagger: 0.08, immediateRender: false },
              t + 0.08,
            );
            tl.fromTo(card + " .e4-l", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power4.out", stagger: 0.06, immediateRender: false }, t + 0.08);
            tl.fromTo(card + " .e4-traco", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.24, ease: "power3.out", immediateRender: false }, t + B);
            tl.fromTo(card + " .e4-desc", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, t + B);
            tl.fromTo(
              card + " .e4-chip",
              { scale: 0.6, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.09, immediateRender: false },
              t + 2 * B,
            );
            tl.fromTo(card + " .e4-card-num", { x: 140 }, { x: -30, duration: CARD, ease: "power2.out", immediateRender: false }, t);
            if (i > 0) {
              const prev = "#e4-c" + i;
              tl.to(prev, { scale: 0.92, duration: 0.16, ease: "power2.in" }, t);
              // o card 3 entra cobrindo a tela inteira (escala + blur): o anterior some no próprio beat
              tl.set(prev, { autoAlpha: 0 }, i === 2 ? t : t + 0.18);
            }
            tl.set(".e4-num", { opacity: 0 }, t);
            tl.set("#e4-n" + (i + 1), { opacity: 1 }, t);
            tl.fromTo("#e4-n" + (i + 1), { y: 24 }, { y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, t);
            tl.to("#e4-barra-fill", { scaleX: (i + 1) / 3, duration: 0.24, ease: "power3.out" }, t);
          }

          tl.to("#e4-c3", { scale: 1.08, duration: 0.25, ease: "power2.in" }, D - 0.25);

          window.__timelines["e4-diferenciais"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
